<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unit Circle Spin Wheel</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #172033;
      --ink: #f8fafc;
      --muted: #a8b3c7;
      --grid: rgba(203, 213, 225, 0.46);
      --red: #ff4d5e;
      --red-dark: #c9182b;
      --blue: #3ba7ff;
      --blue-dark: #0d6efd;
      --gold: #ffd166;
      --wheel-size: min(82vw, 700px);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, rgba(59, 167, 255, 0.18), transparent 34rem),
        radial-gradient(circle at 80% 18%, rgba(255, 77, 94, 0.15), transparent 30rem),
        linear-gradient(135deg, #07111f 0%, var(--bg) 48%, #111827 100%);
      display: grid;
      place-items: center;
      padding: clamp(18px, 3vw, 42px);
    }

    .app {
      width: min(1120px, 100%);
      display: grid;
      gap: 24px;
      justify-items: center;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.4rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .hero p {
      max-width: 720px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: clamp(1.15rem, 2.2vw, 1.45rem);
    }

    .stage {
      position: relative;
      width: calc(var(--wheel-size) + 38px);
      max-width: 100%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 34px 60px rgba(0, 0, 0, 0.46));
    }

    .pointer {
      --pointer-angle: 0deg;
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      justify-items: center;
      pointer-events: none;
      transform: rotate(var(--pointer-angle));
      transition: transform 3s cubic-bezier(0.11, 0.77, 0.16, 1);
    }

    .pointer.spinning { transition-property: transform; }

    .pointer::before {
      content: "";
      width: clamp(16px, 2.8vw, 26px);
      height: clamp(28px, 5vw, 44px);
      border-radius: 999px 999px 10px 10px;
      background: linear-gradient(180deg, #f8fafc, #cbd5e1);
      box-shadow: inset 0 -5px 10px rgba(0, 0, 0, 0.22), 0 5px 12px rgba(0, 0, 0, 0.32);
    }

    .pointer::after {
      content: "";
      width: 0;
      height: 0;
      border-left: clamp(24px, 4.8vw, 40px) solid transparent;
      border-right: clamp(24px, 4.8vw, 40px) solid transparent;
      border-top: clamp(54px, 9vw, 82px) solid var(--gold);
      filter: drop-shadow(0 5px 0 #9f6a00) drop-shadow(0 12px 14px rgba(0, 0, 0, 0.38));
      margin-top: -2px;
    }

    .wheel {
      position: relative;
      width: var(--wheel-size);
      aspect-ratio: 1;
      border-radius: 50%;
      border: clamp(8px, 1.5vw, 14px) solid #f8fafc;
      cursor: pointer;
      user-select: none;
      background:
        radial-gradient(circle, rgba(248, 250, 252, 0.98) 0 5px, transparent 6px),
        radial-gradient(circle, #f7fbff 0 58%, #eef6ff 59% 70%, #dbeafe 71% 100%);
      box-shadow:
        inset 0 0 0 2px rgba(15, 23, 42, 0.22),
        inset 0 0 45px rgba(59, 130, 246, 0.18),
        0 0 0 9px rgba(59, 167, 255, 0.16);
    }

    .wheel.spinning { cursor: wait; }

    .axis {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 88%;
      height: 2px;
      background: var(--grid);
      transform-origin: 50% 50%;
    }

    .axis.x { transform: translate(-50%, -50%); }
    .axis.y { transform: translate(-50%, -50%) rotate(90deg); }

    .axis::before, .axis::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
    }

    .axis::before { left: -1px; transform: translate(-100%, -50%) rotate(180deg); border-left: 11px solid var(--grid); }
    .axis::after { right: -1px; transform: translate(100%, -50%); border-left: 11px solid var(--grid); }

    .ring {
      position: absolute;
      inset: 13%;
      border: 2px solid rgba(15, 23, 42, 0.22);
      border-radius: 50%;
    }

    .tick {
      --angle: 0deg;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 100%;
      transform: translate(-50%, -50%) rotate(var(--angle));
    }

    .tick::before {
      content: "";
      position: absolute;
      top: 4%;
      left: 50%;
      width: 5px;
      height: 9%;
      border-radius: 10px;
      background: #111827;
      transform: translateX(-50%);
    }

    .degree {
      position: absolute;
      left: 50%;
      top: 11.5%;
      color: var(--red);
      font-weight: 1000;
      font-size: clamp(1.05rem, 3.1vw, 1.75rem);
      text-shadow: 0 1px 0 #fff, 0 0 12px rgba(255, 255, 255, 0.7);
      transform: translate(-50%, -50%) rotate(calc(-1 * var(--angle)));
      white-space: nowrap;
    }

    .center-label {
      position: absolute;
      inset: 35%;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid rgba(15, 23, 42, 0.2);
      background: rgba(255, 255, 255, 0.82);
      color: #0f172a;
      font-weight: 900;
      letter-spacing: -0.04em;
      font-size: clamp(1.55rem, 4.8vw, 3.15rem);
    }

    .controls, .result-card {
      width: min(760px, 100%);
      padding: clamp(18px, 3vw, 26px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 24px;
      background: rgba(17, 24, 39, 0.74);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.26);
    }

    .spin-button, .reveal-button {
      border: 0;
      border-radius: 999px;
      color: white;
      font-weight: 950;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.26);
    }

    .spin-button {
      padding: 18px 54px;
      font-size: 1.25rem;
      background: linear-gradient(135deg, var(--red), var(--red-dark));
    }

    .spin-button:disabled, .reveal-button:disabled { opacity: 0.55; cursor: not-allowed; }

    .result-card {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .result-label { color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; }
    .degree-result { color: var(--red); font-size: clamp(2.2rem, 7vw, 4.3rem); font-weight: 1000; line-height: 1; }

    .reveal-button { padding: 13px 21px; background: linear-gradient(135deg, var(--blue), var(--blue-dark)); }
    .radian-result { min-width: 96px; color: var(--blue); font-size: clamp(1.8rem, 5vw, 3.3rem); font-weight: 950; }

    .fraction { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; vertical-align: middle; }
    .fraction .top { border-bottom: 0.08em solid currentColor; padding: 0 0.12em 0.08em; }
    .fraction .bottom { padding-top: 0.08em; }

    @media (max-width: 700px) {
      :root { --wheel-size: min(91vw, 560px); }
      .stage { width: min(100%, calc(var(--wheel-size) + 18px)); }
      .controls, .result-card { border-radius: 20px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>Unit Circle Spin Wheel</h1>
      <p>Click the classic unit circle or press SPIN to send the arrow around the unit circle.</p>
    </header>

    <section class="stage" aria-label="Interactive unit circle spin wheel">
      <div class="pointer" aria-hidden="true"></div>
      <div class="wheel" id="wheel" role="button" tabindex="0" aria-label="Spin the unit circle wheel">
        <div class="axis x" aria-hidden="true"></div>
        <div class="axis y" aria-hidden="true"></div>
        <div class="ring" aria-hidden="true"></div>
        <div class="center-label">Unit<br>Circle</div>
      </div>
    </section>

    <section class="controls">
      <button class="spin-button" id="spinButton" type="button">SPIN</button>
    </section>

    <section class="result-card" aria-live="polite">
      <div>
        <div class="result-label">Result</div>
        <div class="degree-result" id="degreeResult">—</div>
      </div>
      <button class="reveal-button" id="revealButton" type="button" disabled>Reveal Radian</button>
      <div class="radian-result" id="radianResult" aria-label="Radian measure"></div>
    </section>
  </main>

  <script>
    (() => {
      const standardAngles = [0, 30, 45, 60, 90, 120, 135, 150, 180, 210, 225, 240, 270, 300, 315, 330];
      const displayedAngles = [...standardAngles, 360];
      const radians = {
        0: "0", 30: frac("π", "6"), 45: frac("π", "4"), 60: frac("π", "3"), 90: frac("π", "2"),
        120: frac("2π", "3"), 135: frac("3π", "4"), 150: frac("5π", "6"), 180: "π",
        210: frac("7π", "6"), 225: frac("5π", "4"), 240: frac("4π", "3"), 270: frac("3π", "2"),
        300: frac("5π", "3"), 315: frac("7π", "4"), 330: frac("11π", "6")
      };

      const pointer = document.querySelector(".pointer");
      const wheel = document.getElementById("wheel");
      const spinButton = document.getElementById("spinButton");
      const revealButton = document.getElementById("revealButton");
      const degreeResult = document.getElementById("degreeResult");
      const radianResult = document.getElementById("radianResult");
      let currentPointerRotation = 0;
      let winningAngle = null;
      let isSpinning = false;
      let audioContext;
      let tickTimer;

      function frac(top, bottom) {
        return `<span class="fraction"><span class="top">${top}</span><span class="bottom">${bottom}</span></span>`;
      }

      function drawTicks() {
        displayedAngles.forEach((angle) => {
          const tick = document.createElement("div");
          tick.className = "tick";
          tick.style.setProperty("--angle", `${90 - angle}deg`);
          tick.innerHTML = `<span class="degree">${angle}°</span>`;
          wheel.appendChild(tick);
        });
      }

      function ensureAudio() {
        audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === "suspended") audioContext.resume();
      }

      function playTick() {
        if (!audioContext) return;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(980, audioContext.currentTime);
        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.055, audioContext.currentTime + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.045);
        osc.connect(gain).connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + 0.05);
      }

      function scheduleTicks(duration) {
        clearTimeout(tickTimer);
        const start = performance.now();
        let lastTick = -1;
        const loop = (now) => {
          const progress = Math.min((now - start) / duration, 1);
          const easedDistance = 1 - Math.pow(1 - progress, 3);
          const tickIndex = Math.floor(easedDistance * 96);
          if (tickIndex !== lastTick) {
            playTick();
            lastTick = tickIndex;
          }
          if (progress < 1) tickTimer = setTimeout(() => requestAnimationFrame(loop), 12 + progress * 58);
        };
        requestAnimationFrame(loop);
      }

      function spin() {
        if (isSpinning) return;
        ensureAudio();
        isSpinning = true;
        winningAngle = standardAngles[Math.floor(Math.random() * standardAngles.length)];
        degreeResult.textContent = "Spinning…";
        radianResult.innerHTML = "";
        revealButton.disabled = true;
        spinButton.disabled = true;

        const currentMod = ((currentPointerRotation % 360) + 360) % 360;
        const targetMod = (90 - winningAngle + 360) % 360;
        const offset = (targetMod - currentMod + 360) % 360;
        const fullRotations = 360 * (5 + Math.floor(Math.random() * 3));
        currentPointerRotation += fullRotations + offset;

        const duration = 2200 + Math.random() * 650;
        pointer.classList.add("spinning");
        wheel.classList.add("spinning");
        pointer.style.transitionDuration = `${duration}ms`;
        pointer.style.setProperty("--pointer-angle", `${currentPointerRotation}deg`);
        scheduleTicks(duration);
      }

      pointer.addEventListener("transitionend", (event) => {
        if (event.propertyName !== "transform") return;
        isSpinning = false;
        pointer.classList.remove("spinning");
        wheel.classList.remove("spinning");
        spinButton.disabled = false;
        revealButton.disabled = false;
        degreeResult.textContent = `${winningAngle}°`;
        playTick();
      });

      revealButton.addEventListener("click", () => {
        if (winningAngle === null) return;
        radianResult.innerHTML = radians[winningAngle];
      });

      spinButton.addEventListener("click", spin);
      wheel.addEventListener("click", spin);
      wheel.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          spin();
        }
      });

      drawTicks();
    })();
  </script>
</body>
</html>
