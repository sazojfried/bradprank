<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missing Ex</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --ring-blue: #167cca;
      --ink: #374f57;
      --muted: #677f86;
      --field: #74898e;
      --panel: #edf6f5;
      --divider: #d8e9e8;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--panel);
    }

    .app {
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--panel);
    }

    .topbar {
      height: 52px;
      display: grid;
      place-items: center;
      padding: 0 56px;
      color: #66858d;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.01em;
      background: rgba(238, 248, 247, 0.96);
      border-bottom: 1px solid var(--divider);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .close {
      position: absolute;
      right: 17px;
      top: 7px;
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      color: #1f6f93;
      font-size: 44px;
      font-weight: 200;
      line-height: 34px;
      transform: rotate(45deg);
      cursor: default;
    }

    .photo-wrap {
      position: relative;
      height: clamp(244px, 48vh, 390px);
      min-height: 244px;
      background: linear-gradient(135deg, #24593d, #8bac83);
      overflow: hidden;
    }

    .photo-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 32px 28px 74px;
      text-align: center;
      color: #ffffff;
      background:
        radial-gradient(circle at 29% 26%, rgba(255, 255, 255, 0.36) 0 10%, transparent 11%),
        linear-gradient(rgba(31, 86, 45, 0.83), rgba(83, 129, 72, 0.78)),
        url("images/ex.png") center/cover;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.48);
    }

    .photo-wrap.has-photo .photo-placeholder,
    .photo-wrap.has-photo .photo-picker,
    .photo-preview[hidden],
    .photo-placeholder[hidden] {
      display: none !important;
    }

    .photo-placeholder strong {
      display: block;
      margin-bottom: 12px;
      font-size: clamp(34px, 9vw, 52px);
      line-height: 1.04;
      font-weight: 900;
    }

    .photo-placeholder span {
      display: block;
      max-width: 680px;
      margin: 0 auto;
      font-size: clamp(19px, 5vw, 31px);
      line-height: 1.22;
      font-weight: 600;
    }

    .photo-picker {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 2;
    }

    .photo-picker input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .photo-picker label {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 11px 22px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.72);
      background: rgba(24, 50, 58, 0.7);
      color: #fff;
      font-size: clamp(18px, 4.7vw, 30px);
      font-weight: 900;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .form-panel {
      padding: 16px clamp(18px, 5vw, 48px) 30px;
      background: linear-gradient(#edf6f5, #e6f2f1);
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: clamp(18px, 4.5vw, 28px);
      font-weight: 900;
    }

    .text-field {
      width: 100%;
      border: 2px solid var(--field);
      border-radius: 9px;
      padding: 14px 15px;
      background: rgba(255, 255, 255, 0.4);
      color: #3d535b;
      font: 400 clamp(23px, 6vw, 39px)/1.15 Arial, Helvetica, sans-serif;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.78);
    }

    .text-field:focus {
      border-color: #1a78ad;
      box-shadow: 0 0 0 2px rgba(24, 116, 169, 0.14);
    }

    textarea.text-field {
      min-height: 92px;
      resize: none;
    }

    .bottom-input {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      margin-bottom: 14px;
      border: 2px solid #2a7eac;
      border-radius: 9px;
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.32);
    }

    .bottom-input span:first-child {
      flex: 1;
      min-height: 24px;
    }

    .clear-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #6d8d99;
      color: white;
      font-size: 20px;
      font-weight: 900;
    }

    .preview-button {
      width: 100%;
      border: 0;
      border-radius: 2px;
      padding: 18px 20px;
      background: var(--ring-blue);
      color: white;
      font-size: clamp(22px, 5.8vw, 38px);
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.13);
    }

    @media (min-width: 720px) {
      body {
        background: #dcebea;
      }

      .app {
        max-width: 640px;
        box-shadow: 0 0 0 1px rgba(68, 91, 98, 0.08);
      }
    }
  </style>
</head>

<body>
  <main class="app" aria-label="Missing Ex form">
    <header class="topbar">
      <span>Missing Ex</span>
      <button class="close" type="button" aria-label="Close">+</button>
    </header>

    <div class="photo-wrap" id="photo-wrap">
      <img class="photo-preview" id="photo-preview" src="" alt="Uploaded preview" hidden />
      <div class="photo-placeholder" id="photo-placeholder">
        <div>
          <strong>Add your photo</strong>
          <span>Click “Choose photo” below, or add images/ex-photo.jpg and set the img src to that path.</span>
        </div>
      </div>
      <div class="photo-picker">
        <input id="photo-input" type="file" accept="image/*" />
        <label for="photo-input">Choose photo</label>
      </div>
    </div>

    <form class="form-panel">
      <div class="field-group">
        <label class="field-label" for="ex-name">Ex's Name</label>
        <input class="text-field" id="ex-name" value="Brad" />
      </div>

      <div class="field-group">
        <label class="field-label" for="description">Description</label>
        <textarea class="text-field" id="description">Brad was last seen dodging accountability!</textarea>
      </div>

      <div class="bottom-input" aria-label="extra text entry mockup">
        <span></span>
        <span class="clear-dot">×</span>
      </div>

      <button class="preview-button" type="button">Preview Post</button>
    </form>
  </main>

  <script>
    const photoInput = document.querySelector('#photo-input');
    const photoPreview = document.querySelector('#photo-preview');
    const photoPlaceholder = document.querySelector('#photo-placeholder');
    const photoWrap = document.querySelector('#photo-wrap');
    let previewUrl;

    const clearPhoto = () => {
      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = undefined;
      }

      photoPreview.hidden = true;
      photoPreview.removeAttribute('src');
      photoPlaceholder.hidden = false;
      photoWrap.classList.remove('has-photo');
    };

    photoInput.addEventListener('change', () => {
      const [file] = photoInput.files;

      if (!file) {
        clearPhoto();
        return;
      }

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
      }

      previewUrl = URL.createObjectURL(file);
      photoPreview.src = previewUrl;
      photoPreview.hidden = false;
      photoPlaceholder.hidden = true;
      photoWrap.classList.add('has-photo');
    });
  </script>
</body>
</html>
